name: Scrape Disk Prices

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      export_only:
        description: 'Skip Amazon/SEA/affiliate scrapers; only init_db → deactivate_non_storage → export products.json → commit (for accessory purge without ZenRows)'
        type: boolean
        default: false
      force_scrape:
        description: 'Override ZENROWS_PAUSED/SCRAPE_PAUSED and run a full scrape (emergency only; burns ZenRows credits)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      # Resolve skip_scrape: explicit export_only, or repo var ZENROWS_PAUSED /
      # SCRAPE_PAUSED (unless force_scrape). Schedule inherits vars so cron does
      # not burn ZenRows while paused; export_json + commit still run.
      - name: Resolve scrape mode
        id: mode
        env:
          ZENROWS_PAUSED: ${{ vars.ZENROWS_PAUSED }}
          SCRAPE_PAUSED: ${{ vars.SCRAPE_PAUSED }}
        run: |
          EXPORT_ONLY="${{ inputs.export_only }}"
          FORCE="${{ inputs.force_scrape }}"
          PAUSED=false
          if [ "${ZENROWS_PAUSED}" = "true" ] || [ "${SCRAPE_PAUSED}" = "true" ]; then
            PAUSED=true
          fi

          SKIP=false
          REASON=""
          if [ "$EXPORT_ONLY" = "true" ]; then
            SKIP=true
            REASON="export_only input"
          elif [ "$PAUSED" = "true" ] && [ "$FORCE" != "true" ]; then
            SKIP=true
            REASON="ZENROWS_PAUSED/SCRAPE_PAUSED (set force_scrape=true to override)"
          fi

          echo "skip_scrape=$SKIP" >> "$GITHUB_OUTPUT"
          echo "paused=$PAUSED" >> "$GITHUB_OUTPUT"
          if [ "$SKIP" = "true" ]; then
            echo "skip_scrape=true ($REASON) — export-only path (no Amazon/ZenRows HTTP)."
            echo "Will run export_json.py (init_db → deactivate_non_storage → write data/products.json)."
          else
            if [ "$PAUSED" = "true" ] && [ "$FORCE" = "true" ]; then
              echo "force_scrape=true while paused — running full scrape (ZenRows credits will be used)."
            else
              echo "Full scrape path (Amazon hard-fail + SEA soft-fail)."
            fi
          fi

      - name: Run Amazon scraper
        id: scrape
        if: ${{ steps.mode.outputs.skip_scrape != 'true' }}
        env:
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
        run: |
          set -o pipefail
          echo "Starting Amazon scraper..."
          python scraper.py 2>&1 | tee scraper_output.log

      - name: Show Amazon scraper output
        if: ${{ always() && steps.mode.outputs.skip_scrape != 'true' }}
        run: cat scraper_output.log || echo "No Amazon log"

      # --- SEA (Shopee / Lazada) via ZenRows — soft-fail first week ---
      # Amazon remains the hard fail. These steps use continue-on-error + SEA_SOFT_FAIL=1
      # so one platform outage still lets the other + export ship.
      - name: Run Shopee ZenRows scraper
        id: shopee_zenrows
        if: ${{ steps.mode.outputs.skip_scrape != 'true' }}
        continue-on-error: true
        env:
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          SEA_SOFT_FAIL: "1"
        run: |
          set -o pipefail
          if [ -z "${ZENROWS_API_KEY}" ]; then
            echo "ZENROWS_API_KEY not set — skipping Shopee ZenRows scrape."
            exit 0
          fi
          echo "Starting Shopee ZenRows scraper..."
          python shopee_scraper.py 2>&1 | tee shopee_zenrows_output.log

      - name: Show Shopee ZenRows output
        if: ${{ always() && steps.mode.outputs.skip_scrape != 'true' }}
        run: cat shopee_zenrows_output.log || echo "No Shopee ZenRows log (skipped or not run)"

      - name: Run Lazada ZenRows scraper
        id: lazada_zenrows
        if: ${{ steps.mode.outputs.skip_scrape != 'true' }}
        continue-on-error: true
        env:
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          SEA_SOFT_FAIL: "1"
        run: |
          set -o pipefail
          if [ -z "${ZENROWS_API_KEY}" ]; then
            echo "ZENROWS_API_KEY not set — skipping Lazada ZenRows scrape."
            exit 0
          fi
          echo "Starting Lazada ZenRows scraper..."
          python lazada_scraper.py 2>&1 | tee lazada_zenrows_output.log

      - name: Show Lazada ZenRows output
        if: ${{ always() && steps.mode.outputs.skip_scrape != 'true' }}
        run: cat lazada_zenrows_output.log || echo "No Lazada ZenRows log (skipped or not run)"

      - name: Run BuyWhere importer
        id: buywhere
        if: ${{ steps.mode.outputs.skip_scrape != 'true' }}
        env:
          BUYWHERE_API_KEY: ${{ secrets.BUYWHERE_API_KEY }}
        run: |
          set -o pipefail
          if [ -z "${BUYWHERE_API_KEY}" ]; then
            echo "BUYWHERE_API_KEY not set — skipping BuyWhere multi-platform import."
            echo "Docs: https://buywhere.ai/quickstart  (see docs/DATA_SOURCES.md)"
            exit 0
          fi
          echo "Starting BuyWhere importer..."
          python buywhere_scraper.py 2>&1 | tee buywhere_output.log

      - name: Show BuyWhere output
        if: ${{ always() && steps.mode.outputs.skip_scrape != 'true' }}
        run: cat buywhere_output.log || echo "No BuyWhere log (skipped or not run)"

      - name: Run Shopee Affiliate importer
        id: shopee
        if: ${{ steps.mode.outputs.skip_scrape != 'true' }}
        env:
          SHOPEE_AFFILIATE_APP_ID: ${{ secrets.SHOPEE_AFFILIATE_APP_ID }}
          SHOPEE_AFFILIATE_SECRET: ${{ secrets.SHOPEE_AFFILIATE_SECRET }}
        run: |
          set -o pipefail
          if [ -z "${SHOPEE_AFFILIATE_APP_ID}" ] || [ -z "${SHOPEE_AFFILIATE_SECRET}" ]; then
            echo "SHOPEE_AFFILIATE_APP_ID / SHOPEE_AFFILIATE_SECRET not set — skipping Shopee Affiliate import."
            echo "Signup: https://affiliate.shopee.sg/  (see docs/AFFILIATE_SETUP.md)"
            exit 0
          fi
          echo "Starting Shopee Affiliate importer..."
          python shopee_affiliate_scraper.py 2>&1 | tee shopee_output.log

      - name: Show Shopee output
        if: ${{ always() && steps.mode.outputs.skip_scrape != 'true' }}
        run: cat shopee_output.log || echo "No Shopee log (skipped or not run)"

      - name: Run Lazada Affiliate importer
        id: lazada
        if: ${{ steps.mode.outputs.skip_scrape != 'true' }}
        env:
          LAZADA_AFFILIATE_APP_KEY: ${{ secrets.LAZADA_AFFILIATE_APP_KEY }}
          LAZADA_AFFILIATE_APP_SECRET: ${{ secrets.LAZADA_AFFILIATE_APP_SECRET }}
          LAZADA_AFFILIATE_ACCESS_TOKEN: ${{ secrets.LAZADA_AFFILIATE_ACCESS_TOKEN }}
        run: |
          set -o pipefail
          if [ -z "${LAZADA_AFFILIATE_APP_KEY}" ] || [ -z "${LAZADA_AFFILIATE_APP_SECRET}" ]; then
            echo "LAZADA_AFFILIATE_APP_KEY / LAZADA_AFFILIATE_APP_SECRET not set — skipping Lazada Affiliate import."
            echo "Signup: https://www.lazada.sg/lazada-affiliate-program  (see docs/AFFILIATE_SETUP.md)"
            echo "Note: script is a stub until Affiliate product-search endpoint is confirmed after approval."
            exit 0
          fi
          echo "Starting Lazada Affiliate importer..."
          python lazada_affiliate_scraper.py 2>&1 | tee lazada_output.log

      - name: Show Lazada output
        if: ${{ always() && steps.mode.outputs.skip_scrape != 'true' }}
        run: cat lazada_output.log || echo "No Lazada log (skipped or not run)"

      # Always runs (full scrape and export_only). export_json.py calls init_db() then
      # deactivate_non_storage() before writing data/products.json (#20/#23 accessory purge).
      - name: Export to JSON
        run: python export_json.py

      - name: Fail if products.json empty
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("data/products.json")
          if not p.exists():
              print("data/products.json missing")
              sys.exit(1)
          data = json.loads(p.read_text())
          products = data.get("products", data if isinstance(data, list) else [])
          n = len(products)
          print(f"products_count={n}")
          if n == 0:
              print("Refusing to commit empty products.json")
              sys.exit(1)
          PY

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update prices: $(date +%Y-%m-%d-%H%M)"
          file_pattern: "diskprices.db data/products.json"
          commit_user_name: "github-actions"
          commit_user_email: "actions@github.com"

      - name: Upload logs
        if: ${{ always() && steps.mode.outputs.skip_scrape != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: scraper-logs
          path: |
            scraper_output.log
            shopee_zenrows_output.log
            lazada_zenrows_output.log
            buywhere_output.log
            shopee_output.log
            lazada_output.log
          retention-days: 3
          if-no-files-found: ignore
