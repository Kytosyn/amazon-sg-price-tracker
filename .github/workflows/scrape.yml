name: Scrape Disk Prices

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run scraper
        id: scrape
        env:
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
        run: |
          set -o pipefail
          echo "Starting scraper..."
          python scraper.py 2>&1 | tee scraper_output.log

      - name: Show scraper output
        if: always()
        run: cat scraper_output.log || echo "No log"

      - name: Export to JSON
        run: python export_json.py

      - name: Fail if products.json empty
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("data/products.json")
          if not p.exists():
              print("data/products.json missing")
              sys.exit(1)
          data = json.loads(p.read_text())
          products = data.get("products", data if isinstance(data, list) else [])
          n = len(products)
          print(f"products_count={n}")
          if n == 0:
              print("Refusing to commit empty products.json")
              sys.exit(1)
          PY

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update prices: $(date +%Y-%m-%d-%H%M)"
          file_pattern: "diskprices.db data/products.json"
          commit_user_name: "github-actions"
          commit_user_email: "actions@github.com"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-logs
          path: scraper_output.log
          retention-days: 7
