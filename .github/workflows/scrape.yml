name: Scrape Disk Prices

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml
      
      - name: Run scraper
        id: scrape
        continue-on-error: true
        run: |
          echo "Starting scraper..."
          python scraper.py 2>&1 | tee scraper_output.log
          echo "exit_code=$?" >> $GITHUB_OUTPUT
      
      - name: Show scraper output
        if: always()
        run: cat scraper_output.log || echo "No log"
      
      - name: Commit and push
        if: steps.scrape.outputs.exit_code == '0'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update prices: $(date +%Y-%m-%d-%H%M)"
          file_pattern: "diskprices.db data/products.json"
          commit_user_name: "github-actions"
          commit_user_email: "actions@github.com"
      
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-logs
          path: scraper_output.log
          retention-days: 7
