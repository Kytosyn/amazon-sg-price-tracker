name: Daily DiskPrices SG Scrape

on:
  schedule:
    - cron: '0 9 * * *'  # 9 AM SGT daily
  workflow_dispatch:  # Allow manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium
      
      - name: Run scraper
        run: python scraper.py
      
      - name: Export to JSON
        run: python export_json.py
      
      - name: Commit and push database
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add diskprices.db data/products.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update price data: $(date +%Y-%m-%d)"
          git push
