name: CI

on:
  pull_request:
  push:
    branches: [master]
    paths-ignore:
      - 'data/products.json'
      - 'diskprices.db'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml pyyaml
      - name: Validate workflow YAML
        run: python -c "import glob, yaml; [yaml.safe_load(open(f)) for f in glob.glob('.github/workflows/*.yml')]; print('workflow YAML ok')"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
